services:
    mysql:
        image: mysql
        container_name: mysql
        volumes:
            - workcalendar_dist:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=1
        ports:
            - "3306:3306"

    flask:
        build: ./appserver
        container_name: flask
        restart: always
        depends_on:
            - mysql
        ports:
            - "19999:19999"

    nginx:
        build: ./nginx
        container_name: nginx
        restart: always
        ports:
            - "20000:20000"

volumes:
    workcalendar_dist:
